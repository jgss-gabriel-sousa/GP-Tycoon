<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage a racing team in this game, drawing inspiration from Cockpit Manager, Brasfoot, Football Manager, and more. Immerse yourself in this thrilling world, making strategic decisions to guide your team to victory.">
    
    <link rel="stylesheet" href="./styles/styles.css"/>
	<link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    
    <script src="./lib/sweetalert2.min.js"></script>

    <link rel="stylesheet" href="./lib/sweetalert2.min.css">
    <link rel="stylesheet" href="./lib/line-icons/lineicons.css">

    <script src="./lib/popper.min.js"></script>
    <script src="./lib/tippy-bundle.umd.min.js"></script>
    <script src="./lib/chart.js" defer></script>
    <script src="./lib/iconify/iconify-icon.min.js"></script>

    <script src="./scripts/events.js" type="module" defer></script>
    
    <title>Grand Prix Tycoon</title>
</head>
<body>
    <main>
        <div id="game-interface">
            <div id="topbar-buttons">
                <button type="button" id="btn-options"><img src="./img/ui/settings.png"></button>
                <button type="button" id="btn-menu-team" class="topbar-active"><img src="./img/ui/steering-wheel.png"> Central da Equipe</button>
                <button type="button" id="btn-menu-car-development"><img src="./img/ui/f1-car.png"> Desenvolvimento do Carro</button>
                <button type="button" id="btn-menu-tecnical-team"><img src="./img/ui/market-eng.png"> Equipe Técnica</button>
                <button type="button" id="btn-menu-race-strategy"><img src="./img/ui/finish-line-flag.png"> Estratégia & Corridas</button>
                <button type="button" id="btn-menu-standings"><img src="./img/ui/ranking.png"> Temporada & Classificação</button>
                <button type="button" id="btn-menu-finances"><img src="./img/ui/loan.png"> Gestão Financeira</button>
                <button type="button" id="btn-menu-regulations"><img src="./img/ui/regulation.png"> Regulamentos & Votações</button>
            </div>

            <div id="menu-container"></div>
        </div>

        <div id="editor-menu">
            <h1>Editor - GP Tycoon</h1>
            
            <div id="editor-menu-interface"></div>
        </div>

        <div id="main-menu">
            <h1>GP Tycoon</h1>
            <div class="wrap">
                <button id="start-game" class="main-menu-btn"><span>Novo Jogo</span></button>
                <button id="load-game" class="main-menu-btn"><span>Carregar Jogo</span></button>
                <button id="editor" class="main-menu-btn"><span>Editor</span></button>
            </div>
            <small>Copyright © <a href="https://jgss-gabriel-sousa.github.io/" target="_blank">JGSS</a> - version 0.15 (Ocon)</small>
        </div>
    </main>
</body>
</html>
